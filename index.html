<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Square Root Tetris</title>

<style>

body{
background:#000;
color:white;
font-family:Arial;
text-align:center;
margin:0;
}

h1{
color:gold;
margin-top:20px;
text-shadow:3px 3px red;
}

canvas{
background:#111;
border:4px solid cyan;
margin-top:10px;
}

#startScreen{
margin-top:120px;
}

.flash{
animation:flash 1s infinite;
}

@keyframes flash{
50%{opacity:0;}
}

#gameArea{
display:none;
}

#info{
font-size:24px;
margin:10px;
}

</style>
</head>

<body>

<div id="startScreen">

<h1>SQUARE ROOT TETRIS</h1>

<h2 class="flash">INSERT COIN</h2>

<h3>PRESS SPACE TO START</h3>

</div>

<div id="gameArea">

<div id="info">

Score:
<span id="score">0</span>

</div>

<canvas id="game" width="300" height="600"></canvas>

</div>

<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

const COLS=10;
const ROWS=20;
const SIZE=30;

let score=0;

const colors=[
"",
"#00FFFF",
"#FFFF00",
"#AA00FF",
"#00FF00",
"#FF0000",
"#0000FF",
"#FF8800"
];

const shapes=[

[
[1,1,1,1]
],

[
[2,2],
[2,2]
],

[
[0,3,0],
[3,3,3]
],

[
[0,4,4],
[4,4,0]
],

[
[5,5,0],
[0,5,5]
],

[
[6,0,0],
[6,6,6]
],

[
[0,0,7],
[7,7,7]
]

];

let board=[];

function createBoard(){

for(let r=0;r<ROWS;r++){

board[r]=[];

for(let c=0;c<COLS;c++){

board[r][c]=0;

}

}

}

createBoard();

let player={
x:3,
y:0,
shape:null
};

function newPiece(){

player.shape=
shapes[Math.floor(Math.random()*shapes.length)];

player.x=3;
player.y=0;

}

newPiece();

function drawCell(x,y,color){

ctx.fillStyle=color;

ctx.fillRect(
x*SIZE,
y*SIZE,
SIZE,
SIZE
);

ctx.strokeStyle="#222";

ctx.strokeRect(
x*SIZE,
y*SIZE,
SIZE,
SIZE
);

}

function drawBoard(){

for(let r=0;r<ROWS;r++){

for(let c=0;c<COLS;c++){

if(board[r][c]){

drawCell(c,r,colors[board[r][c]]);

}

}

}

}

function drawPlayer(){

for(let r=0;r<player.shape.length;r++){

for(let c=0;c<player.shape[r].length;c++){

if(player.shape[r][c]){

drawCell(
player.x+c,
player.y+r,
colors[player.shape[r][c]]
);

}

}

}

}

function collide(){

for(let r=0;r<player.shape.length;r++){

for(let c=0;c<player.shape[r].length;c++){

if(player.shape[r][c]){

let newY=player.y+r;
let newX=player.x+c;

if(
newY>=ROWS ||
newX<0 ||
newX>=COLS ||
(board[newY] && board[newY][newX])
){

return true;

}

}

}

}

return false;

}

function merge(){

for(let r=0;r<player.shape.length;r++){

for(let c=0;c<player.shape[r].length;c++){

if(player.shape[r][c]){

board[player.y+r][player.x+c]=
player.shape[r][c];

}

}

}

}

function clearLines(){

for(let r=ROWS-1;r>=0;r--){

let full=true;

for(let c=0;c<COLS;c++){

if(board[r][c]===0){

full=false;

break;

}

}

if(full){

board.splice(r,1);

board.unshift(
new Array(COLS).fill(0)
);

score+=100;

document.getElementById("score").innerHTML=
score;

r++;

}

}

}

function update(){

player.y++;

if(collide()){

player.y--;

merge();

clearLines();

newPiece();

if(collide()){

alert("GAME OVER");

createBoard();

score=0;

}

}

}

function draw(){

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);

drawBoard();
drawPlayer();

}

function gameLoop(){

update();
draw();

}

document.addEventListener("keydown",function(e){

if(e.key==="ArrowLeft"){

player.x--;

if(collide()){

player.x++;

}

}

if(e.key==="ArrowRight"){

player.x++;

if(collide()){

player.x--;

}

}

if(e.key==="ArrowDown"){

player.y++;

if(collide()){

player.y--;

}

}

});

document.addEventListener("keydown",function(e){

if(
e.code==="Space" &&
document.getElementById("startScreen").style.display!=="none"
){

document.getElementById("startScreen").style.display="none";

document.getElementById("gameArea").style.display="block";

setInterval(gameLoop,500);

}

});

</script>

</body>
</html>
